name: Research checks and report
on:
  pull_request:
  workflow_dispatch:
    inputs:
      mode:
        description: Report source
        type: choice
        options: [demo, live]
        default: demo
      start:
        description: First completed filing date for live mode (YYYY-MM-DD)
        type: string
      end:
        description: Last completed filing date for live mode (YYYY-MM-DD)
        type: string
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: python -m pip install -r requirements-research.txt
      - run: cp config_example.py config.py
      - run: python -m pytest -q
      - name: Create report
        env:
          REPORT_MODE: ${{ inputs.mode || 'demo' }}
          START_DATE: ${{ inputs.start }}
          END_DATE: ${{ inputs.end }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        shell: bash
        run: |
          if [[ "$REPORT_MODE" == "demo" ]]; then
            python research_scan.py --demo
          else
            arguments=()
            if [[ -n "$START_DATE" ]]; then arguments+=(--start "$START_DATE"); fi
            if [[ -n "$END_DATE" ]]; then arguments+=(--end "$END_DATE"); fi
            python research_scan.py "${arguments[@]}"
          fi
      - name: Save research report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: form4-research-report
          path: research_results/
          if-no-files-found: warn
